# Reverse proxy: the SPA calls /auth, /i, /api/v1/* and nginx fans those out
# to the individual backend microservices (single exposed port topology).
upstream auth { server auth:4001; }
upstream ingestion { server ingestion:4002; }
upstream query { server query-api:4004; }
upstream alerting { server alerting:4005; }
upstream dashboards { server dashboard-config:4006; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /i/ {
        proxy_pass http://ingestion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/dashboards {
        proxy_pass http://dashboards;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/rules {
        proxy_pass http://alerting;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1 {
        proxy_pass http://query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
